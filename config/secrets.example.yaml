arcus:
  api_key: "your_arcus_ed25519_public_key"
  private_key: "your_arcus_ed25519_private_key"
  address: "0x0000000000000000000000000000000000000000"

hyperliquid:
  walletAddress: "your_wallet_address"
  privateKey: "your_private_key"

binance:
  apiKey: "your_binance_api_key"
  secret: "your_binance_secret"

# Telegram bot for `onefill watch run` alerts. Create a bot via @BotFather,
# put its token here and set the chat_id to the chat(s) you want alerts sent to.
# chat_id may be a single id (string) or a list of ids (broadcast to all).
telegram:
  bot_token: "your_telegram_bot_token"
  chat_id:
    - "your_telegram_chat_id"
    # - "another_chat_id"

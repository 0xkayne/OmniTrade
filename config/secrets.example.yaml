# Shared credentials only. Exchange keys belong in secrets.testnet.yaml or
# secrets.mainnet.yaml; these files are selected from the effective network.
# Telegram bot for `onefill watch run` alerts. Create a bot via @BotFather,
# put its token here and set the chat_id to the chat(s) you want alerts sent to.
# chat_id may be a single id (string) or a list of ids (broadcast to all).
telegram:
  bot_token: "your_telegram_bot_token"
  chat_id:
    - "your_telegram_chat_id"
    # - "another_chat_id"

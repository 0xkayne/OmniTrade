exchanges:
  arcus:
    type: "native"
    adapter: "arcus"
    enabled: false
    default_network: "testnet"
    networks:
      mainnet:
        rest_base_url: "https://api.arcus.xyz"
        websocket_url: "wss://api.arcus.xyz/v1/ws"
      testnet:
        rest_base_url: "https://api.testnet.arcus.xyz"
        websocket_url: "wss://api.testnet.arcus.xyz/v1/ws"
    rate_limit: 100
    symbols: []
    fees:
      taker: 0.0
      maker: 0.0

  hyperliquid:
    type: "ccxt"
    enabled: true
    default_network: "testnet"
    networks:
      mainnet:
        rest_base_url: "https://api.hyperliquid.xyz"
        websocket_url: "wss://api.hyperliquid.xyz/ws"
      testnet:
        rest_base_url: "https://api.hyperliquid-testnet.xyz"
        websocket_url: "wss://api.hyperliquid-testnet.xyz/ws"
    rate_limit: 100
    symbols: ["ETH/USD", "BTC/USD"]
    fees:
      taker: 0.00015 # 0.015%
      maker: 0.00045  # 0.045%
    options:
      fetchMarkets:
        # types 必须显式写（浅合并只更新这里列出的键）——否则 hip3 不会被加载。
        types: [spot, swap, hip3]
        hip3:
          # 只加载这三个部署商（hyna/xyz/io）部署的 HIP-3 perp 市场。
          # 注意 io 只在 mainnet 存在；testnet 下 ccxt_exchange 的守卫会把它剔除，
          # 否则 load_markets 会对不存在的 dex 做 offset 索引而 KeyError。
          dexes: [hyna, xyz, io]

  binance:
    type: "ccxt"
    enabled: true
    default_network: "testnet"
    # One venue, separate Spot / USD-M / COIN-M clients. Add coinm to opt in.
    market_families: [spot, usdm]
    # Endpoints are derived and verified by the adapter from CCXT.
    # testnet means Binance Demo Trading, never Spot Testnet credentials.
    networks:
      mainnet: {}
      testnet: {}
    rate_limit: 100
    symbols: ["ETH/USD", "BTC/USD"]
    fees:
      taker: 0.0004
      maker: 0.0002

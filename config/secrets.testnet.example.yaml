# Copy to secrets.testnet.yaml. Never put mainnet credentials in this file.
network: "testnet"

# Quote all credential strings with double quotes; use "" for empty values.
# This preserves 0x prefixes/digits as text rather than YAML numbers.
# Both DEXes: the master account authorizes a separate API signing key.
arcus:
  # Authorizing Ethereum master account; old address/wallet_address must migrate.
  master_wallet_address: ""
  # UI API Key: raw Ed25519 public key/API identity, not an EVM wallet address.
  api_key: ""
  # UI API Signing Key: Ed25519 private key, distinct from the master wallet key.
  # Both API values are 32 bytes/64 hex; only api_signing_key accepts optional 0x.
  api_signing_key: ""

hyperliquid:
  # Connected/funded master wallet address: public account queries only.
  master_wallet_address: ""
  # UI: API Wallet Address (secp256k1-derived EVM address), approved on testnet.
  # Both API fields must be set together; leave both empty for read-only access.
  # The private key must derive this API address, which must differ from master.
  api_wallet_address: ""
  # UI API Wallet Private Key: secp256k1 private key, not an Arcus Ed25519 key.
  api_wallet_private_key: ""
  # Do not place the master wallet's private key here. Old walletAddress,
  # wallet_address, privateKey and private_key fields require migration.
  # Internally maps to CCXT walletAddress/privateKey; these are not YAML keys.
  # Optional signed-action target; passed to CCXT options.vaultAddress.
  # This setting alone does not select the account used by public reads.
  # vaultAddress: "your_vault_or_subaccount_address"

binance:
  # Demo Trading (Spot and Futures):
  # https://demo.binance.com/zh-CN/my/settings/api-management
  # Spot Testnet keys from testnet.binance.vision are not used by this project.
  apiKey: "your_binance_demo_api_key"
  secret: "your_binance_demo_secret"

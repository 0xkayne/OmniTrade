  # Binance 平台币，BNB Chain 核心
  - symbol: BNB
    tag: CEX平台币
  # OKX 平台币
  - symbol: OKB
    tag: CEX平台币
  # Bybit 生态相关代币 (Mantle)
  - symbol: MNT
    tag: CEX平台币
  # Kraken 平台币
  - symbol: INK
    tag: CEX平台币


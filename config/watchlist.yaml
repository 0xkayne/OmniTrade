# Personal watchlist for the price-watch daemon (`onefill watch run`).
#
# Each entry needs a `symbol` (base asset) and a `tag` (category label shown in
# Telegram alerts). Optional per-entry overrides: market_type (perp|spot),
# quote_preference ([USDT, USDC, USD]).
#
# NOTE: symbols below are my best guesses at each project's tradable base asset.
# 有些是美股/财库股代币（COIN/CRCL/MSTR/SOLMATE/PURR…），Hyperliquid/Binance 未必有
# 对应 perp，取不到会静默跳过。请自行核对/修正符号与所属交易所。标注"符号待确认"的是
# 我无法确定的。
#
# HIP-3 市场（部署商建的 perp，如 xyz:/io: 前缀）在 registry 里的 base 是**连字符前缀**
# 形式（XYZ-NVDA），不是裸 ticker。所以这类标的的 symbol 必须写 XYZ-NVDA / IO-SNDK 这种，
# 写裸 NVDA 会精确匹配不到、静默跳过。
#
# 暂禁用（未在 Hyperliquid/Binance 上线，待配置专属数据源后启用）：
#   OKB / INK / BP / VAR / MARSCOIN / SOLMATE

watchlist:
  # ---------- CEX 平台币 ----------
  # Binance 平台币，BNB Chain 核心
  - symbol: BNB
    tag: CEX平台币
  # OKX 平台币（未在 HL/Binance 上线，暂禁用）
  # - symbol: OKB
  #   tag: CEX平台币
  # Bybit 生态相关代币 (Mantle)
  - symbol: MNT
    tag: CEX平台币
  # Kraken 平台币（未在 HL/Binance 上线，暂禁用）
  # - symbol: INK
  #   tag: CEX平台币

  # ---------- Perp DEX 平台币 ----------
  # Hyperliquid 平台币（L1+DEX，核心关注）
  - symbol: HYPE
    tag: Perp DEX平台币
  # Lighter L2 代币；暂不买入，仅观察
  - symbol: LIT
    tag: Perp DEX平台币
  # Backpack 交易所平台币（未在 HL/Binance 上线，暂禁用）
  # - symbol: BP
  #   tag: Perp DEX平台币
  # Variational DEX 平台币（未在 HL/Binance 上线，暂禁用）
  # - symbol: VAR
  #   tag: Perp DEX平台币
  # Aster，币安背书的 L1/平台（符号待确认）
  - symbol: ASTER
    tag: Perp DEX平台币

  # ---------- 币股正规监管叙事 ----------

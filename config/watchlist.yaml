  # ---------- 美股 HIP-3（Hyperliquid 部署商市场，xyz:/io:） ----------
  # 美股 tokenized perp，base 必须用连字符前缀形式（XYZ-NVDA）才能在 registry 里精确命中。
  # 结算为 USDC。IO-SNDK / IO-ANTH 是 io(EntropyIO) 部署商市场，必留。
  # 数据（24h 成交 / 名义未平仓量 / funding）见此前分析；funding 大多是被塞的 6.3e-06 基线，
  # 只有标注偏离的（xyz:TSLA/ARM/MSTR/ZHIPU/CRWD/MSFT/NFLX/SOXL）值得盯。
  - symbol: XYZ-NVDA
    tag: 美股HIP-3
  - symbol: XYZ-SNDK
    tag: 美股HIP-3
  - symbol: XYZ-MU
    tag: 美股HIP-3
  - symbol: XYZ-META
    tag: 美股HIP-3
  - symbol: XYZ-GOOGL
    tag: 美股HIP-3
  - symbol: XYZ-AAPL
    tag: 美股HIP-3
  - symbol: XYZ-TSLA
    tag: 美股HIP-3
  - symbol: XYZ-INTC
    tag: 美股HIP-3
  - symbol: XYZ-AMD
    tag: 美股HIP-3
  - symbol: IO-SNDK
    tag: 美股HIP-3
  - symbol: IO-ANTH
    tag: 美股HIP-3


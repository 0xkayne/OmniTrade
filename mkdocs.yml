site_name: oneFill
site_description: Multi-venue coordinated order execution engine documentation
site_author: OmniTrade
repo_url: https://github.com/0xkayne/OmniTrade
repo_name: 0xkayne/OmniTrade
edit_uri: blob/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            docstring_style: google
            merge_init_into_class: true
            show_if_no_docstring: false
            inherited_members: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            filters:
              - "!^_"
            group_by_category: true
            show_category_heading: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables

nav:
  - Home: index.md
  - Docs Paradigm: docs-paradigm.md
  - User Guide:
      - user-guide/index.md
      - Quick Start: user-guide/quickstart.md
      - CLI Reference: user-guide/cli-reference.md
      - Configuration: user-guide/configuration.md
      - Risk Controls: user-guide/risk-controls.md
  - Developer Guide:
      - developer-guide/index.md
      - Architecture: developer-guide/architecture.md
      - Code Structure and Naming: developer-guide/code-standards.md
      - Product and Domain Requirements: developer-guide/product-requirements.md
      - State Machine: developer-guide/state-machine.md
      - Critical Invariants: developer-guide/invariants.md
      - Coordination Pipeline: developer-guide/coordination-pipeline.md
      - Market Layer: developer-guide/market-layer.md
      - Persistence Layer: developer-guide/persistence-layer.md
      - Exchange Layer: developer-guide/exchange-layer.md
      - Exchange Integration: developer-guide/exchange-integration.md
      - Testing: developer-guide/testing.md
      - Legacy Mode: developer-guide/legacy-mode.md
      - Current Status: developer-guide/current-status.md
      - Agent Integration: developer-guide/agent-integration.md
      - Funding Arbitrage: developer-guide/funding-arbitrage.md
      - API Reference:
          - developer-guide/api-reference/index.md
          - Coordinator: developer-guide/api-reference/coordinator.md
          - Market: developer-guide/api-reference/market.md
          - Persistence: developer-guide/api-reference/persistence.md
          - CLI: developer-guide/api-reference/cli.md
          - Core (shared + legacy): developer-guide/api-reference/core.md
          - Exchanges: developer-guide/api-reference/exchanges.md
          - Funding Arbitrage: developer-guide/api-reference/funding-arb.md
          - Observability: developer-guide/api-reference/observability.md

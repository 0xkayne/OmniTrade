site_name: oneFill
site_description: Multi-venue coordinated order execution engine documentation
site_author: OmniTrade
repo_url: https://github.com/0xkayne/OmniTrade
repo_name: 0xkayne/OmniTrade
edit_uri: blob/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            docstring_style: google
            merge_init_into_class: true
            show_if_no_docstring: false
            inherited_members: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            filters:
              - "!^_"
            group_by_category: true
            show_category_heading: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables

nav:
  - Home: index.md
  - Docs Paradigm: docs-paradigm.md
  - User Guide:
      - user-guide/index.md
      - Getting Started:
          - Quick Start: user-guide/getting_started/quickstart.md
      - CLI:
          - user-guide/cli/index.md
      - Configuration:
          - user-guide/configuration/index.md
          - Risk Controls: user-guide/configuration/risk-controls.md
      - Examples:
          - user-guide/examples/index.md
      - API:
          - user-guide/api/index.md
  - Developer Guide:
      - developer-guide/index.md
      - Design:
          - System:
              - Architecture and Workflow: developer-guide/design/sys-architecture.md
              - Product and Domain Requirements: developer-guide/design/sys-product-requirements.md
              - Critical Invariants: developer-guide/design/sys-invariants.md
          - Execution Core and Base Layers:
              - Coordination Pipeline: developer-guide/design/base-coordination-pipeline.md
              - State Machine: developer-guide/design/base-state-machine.md
              - Market Layer: developer-guide/design/base-market-layer.md
              - Exchange Layer: developer-guide/design/base-exchange-layer.md
              - Exchange Integration: developer-guide/design/base-exchange-integration.md
              - Persistence Layer: developer-guide/design/base-persistence-layer.md
          - Strategy Layer:
              - Strategy Framework: developer-guide/design/strat-framework.md
              - Funding Arbitrage: developer-guide/design/strat-funding-arb.md
              - Price Watch: developer-guide/design/strat-price-watch.md
              - Backtest: developer-guide/design/strat-backtest.md
              - Trade Log: developer-guide/design/strat-trade-log.md
          - Entry and Legacy:
              - Agent Integration: developer-guide/design/entry-agent-api.md
              - Legacy Mode: developer-guide/design/legacy-bot.md
      - Standards:
          - Coding Conventions: developer-guide/standards/code-standards.md
          - Directory Structure: developer-guide/standards/directory-structure.md
          - Naming Conventions: developer-guide/standards/naming-conventions.md
          - Testing: developer-guide/standards/testing.md
      - Reference:
          - Current Status: developer-guide/reference/current-status.md
          - API Reference:
              - developer-guide/reference/api/index.md
              - Coordinator: developer-guide/reference/api/coordinator.md
              - Market: developer-guide/reference/api/market.md
              - Persistence: developer-guide/reference/api/persistence.md
              - CLI: developer-guide/reference/api/cli.md
              - Exchange: developer-guide/reference/api/exchange.md
              - Legacy: developer-guide/reference/api/legacy.md
              - Funding Arbitrage: developer-guide/reference/api/funding-arb.md
              - Observability: developer-guide/reference/api/observability.md
